<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>{{title}}</title>
  {{head}}
</head>
<body>
  <header class="site"><div class="wrap">
    <div class="brand">{{brand}}</div>
    <nav class="crumbs">{{nav}}</nav>
  </div></header>
  <main class="wrap">
    <section class="hero">
      <h1>{{h1}}</h1>
      <p class="lede">{{lede}}</p>
      <div class="stats">{{stats}}</div>
      <p class="muted">Every figure on this page was read from the brand's own official site and carries its source link and check date.</p>
    </section>

    {{body}}

    <p class="muted">{{disclaimer}}</p>

    <footer class="site">{{footer}}</footer>
  </main>
</body>
</html>
