<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" width="960" height="534" role="img" aria-label="Infographic: published prices for four automatic litter boxes read from their own official pages on 2026-09-27 - Litter-Robot 5 at 799 dollars as low as with no list price printed, CatGenie Whoosh at 469 dollars against 499, PETKIT Purobot Max 3 at 399.99 dollars against 499.99, Meowant SC02 at 399.99 dollars against 559.99, plus the trial and warranty each site prints: Litter-Robot 90-day in-home trial and 1 year of WhiskerCare, CatGenie 90-day money-back and 18-month warranty with a drain hook-up required, PETKIT 30-day returns and 2-year warranty on Purobot models, Meowant 90-day free trial on SC09, 30-day on SC02 and 2-year warranty">
  <g font-family="Segoe UI, Arial, sans-serif">

    <text x="8" y="26" font-size="19" font-weight="700" fill="#0f172a">What the four sites print, in their own words</text>
    <text x="8" y="50" font-size="13.5" fill="#475569">Price shown by each brand on its own product page, read 2026-09-27. All four sell in USD, so no conversion is involved.</text>

    <!-- legend -->
    <rect x="672" y="34" width="16" height="16" rx="3" fill="#0f172a"/>
    <text x="694" y="47" font-size="12.5" fill="#334155">price today</text>
    <rect x="800" y="34" width="16" height="16" rx="3" fill="#94a3b8"/>
    <text x="822" y="47" font-size="12.5" fill="#334155">regular price, when printed</text>

    <!-- scale 0.6 px per USD, x0 = 300 -->
    <g>
      <!-- Litter-Robot 5: $799 as low as, no regular price printed -->
      <text x="8" y="94" font-size="13.5" font-weight="600" fill="#0f172a">Litter-Robot 5 (Whisker)</text>
      <text x="8" y="113" font-size="12" fill="#64748b">page says "As low as" - no list price printed</text>
      <rect x="300" y="80" width="479" height="22" rx="5" fill="#0f172a"/>
      <text x="787" y="96" font-size="13" font-weight="600" fill="#0f172a">$799</text>

      <!-- CatGenie Whoosh: $469 against $499 -->
      <text x="8" y="150" font-size="13.5" font-weight="600" fill="#0f172a">CatGenie Whoosh</text>
      <text x="8" y="169" font-size="12" fill="#64748b">A.I. model: $499 against $529</text>
      <rect x="300" y="136" width="281" height="22" rx="5" fill="#0f172a"/>
      <text x="589" y="152" font-size="13" font-weight="600" fill="#0f172a">$469</text>
      <rect x="300" y="162" width="299" height="12" rx="4" fill="#94a3b8"/>
      <text x="607" y="172" font-size="12" fill="#475569">was $499</text>

      <!-- PETKIT Purobot Max 3: $399.99 against $499.99 -->
      <text x="8" y="206" font-size="13.5" font-weight="600" fill="#0f172a">PETKIT Purobot Max 3</text>
      <text x="8" y="225" font-size="12" fill="#64748b">Crystal Duo is the catalog floor at $199.99</text>
      <rect x="300" y="192" width="240" height="22" rx="5" fill="#0f172a"/>
      <text x="548" y="208" font-size="13" font-weight="600" fill="#0f172a">$399.99</text>
      <rect x="300" y="218" width="300" height="12" rx="4" fill="#94a3b8"/>
      <text x="608" y="228" font-size="12" fill="#475569">regular $499.99</text>

      <!-- Meowant SC02: $399.99 against $559.99 -->
      <text x="8" y="262" font-size="13.5" font-weight="600" fill="#0f172a">Meowant MW-SC02</text>
      <text x="8" y="281" font-size="12" fill="#64748b">SC09 large model: $649.99 against $789.99</text>
      <rect x="300" y="248" width="240" height="22" rx="5" fill="#0f172a"/>
      <text x="548" y="264" font-size="13" font-weight="600" fill="#0f172a">$399.99</text>
      <rect x="300" y="274" width="336" height="12" rx="4" fill="#94a3b8"/>
      <text x="644" y="284" font-size="12" fill="#475569">regular $559.99</text>
    </g>

    <!-- axis -->
    <line x1="300" y1="306" x2="780" y2="306" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-size="11.5" fill="#64748b">
      <line x1="300" y1="306" x2="300" y2="312" stroke="#94a3b8"/>
      <text x="300" y="324" text-anchor="middle">$0</text>
      <line x1="420" y1="306" x2="420" y2="312" stroke="#94a3b8"/>
      <text x="420" y="324" text-anchor="middle">$200</text>
      <line x1="540" y1="306" x2="540" y2="312" stroke="#94a3b8"/>
      <text x="540" y="324" text-anchor="middle">$400</text>
      <line x1="660" y1="306" x2="660" y2="312" stroke="#94a3b8"/>
      <text x="660" y="324" text-anchor="middle">$600</text>
      <line x1="780" y1="306" x2="780" y2="312" stroke="#94a3b8"/>
      <text x="780" y="324" text-anchor="middle">$800</text>
    </g>

    <!-- trial / warranty panel -->
    <rect x="8" y="344" width="944" height="146" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="26" y="372" font-size="15.5" font-weight="700" fill="#0f172a">Try-it terms each site prints next to the buy button</text>
    <g>
      <rect x="26" y="386" width="222" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="40" y="408" font-size="13" font-weight="700" fill="#0f172a">Litter-Robot</text>
      <text x="40" y="428" font-size="12" fill="#475569">90-day in-home trial, you pay</text>
      <text x="40" y="445" font-size="12" fill="#475569">return shipping; 1 year of</text>
      <text x="40" y="462" font-size="12" fill="#475569">WhiskerCare included, 3 years $149.</text>

      <rect x="258" y="386" width="222" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="272" y="408" font-size="13" font-weight="700" fill="#0f172a">CatGenie</text>
      <text x="272" y="428" font-size="12" fill="#475569">90-day money-back, outgoing</text>
      <text x="272" y="445" font-size="12" fill="#475569">shipping not refunded; 18-month</text>
      <text x="272" y="462" font-size="12" fill="#475569">warranty. Needs a drain or toilet.</text>

      <rect x="490" y="386" width="222" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="504" y="408" font-size="13" font-weight="700" fill="#0f172a">PETKIT</text>
      <text x="504" y="428" font-size="12" fill="#475569">Return within 30 calendar days;</text>
      <text x="504" y="445" font-size="12" fill="#475569">2-year warranty on Purobot</text>
      <text x="504" y="462" font-size="12" fill="#475569">Ultra, Max 3, Max Pro 2, Crystal Duo.</text>

      <rect x="722" y="386" width="214" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="736" y="408" font-size="13" font-weight="700" fill="#0f172a">Meowant</text>
      <text x="736" y="428" font-size="12" fill="#475569">90-Day Free Trial on SC09,</text>
      <text x="736" y="445" font-size="12" fill="#475569">30-Day Free Trial on SC02,</text>
      <text x="736" y="462" font-size="12" fill="#475569">2-Year Warranty, 30-Day Price Protection.</text>
    </g>

    <text x="8" y="513" font-size="12" fill="#64748b">All figures in USD as printed on each brand's own official page, read 2026-09-27. "As low as" is Litter-Robot's wording; the other three show today's price beside a regular price.</text>
  </g>
</svg>
